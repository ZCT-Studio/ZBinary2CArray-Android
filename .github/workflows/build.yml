name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  APP_NAME: zbtca-android
  JAVA_VERSION: '17'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore release keystore
        if: env.ANDROID_KEYSTORE_BASE64
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          echo "${ANDROID_KEYSTORE_BASE64}" \
            | tr -d '\r\n ' \
            | base64 --ignore-garbage --decode > "$RUNNER_TEMP/release.jks"

          chmod 600 "$RUNNER_TEMP/release.jks"

      - name: Build Release APK
        run: ./gradlew assembleRelease
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify APKs
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Built APKs ==="
          find app/build/outputs/apk/release -type f -name "*.apk" -print

          if ! find app/build/outputs/apk/release -type f -name "*.apk" | grep -q .; then
            echo "ERROR: No APK was produced."
            exit 1
          fi

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/build/reports/**/*.log
            app/build/reports/**/*.txt
          if-no-files-found: warn

      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/release.jks"


  release:
    name: Create GitHub Release
    needs: build

    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-release
          path: release

      - name: Rename APKs
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-renamed

          shopt -s nullglob

          apks=(release/*.apk)

          if [ ${#apks[@]} -eq 0 ]; then
            echo "ERROR: No APK found in downloaded artifact."
            exit 1
          fi

          for apk in "${apks[@]}"; do
            basename=$(basename "$apk")

            abi="universal"

            if echo "$basename" | grep -q "arm64-v8a"; then
              abi="arm64-v8a"
            elif echo "$basename" | grep -q "armeabi-v7a"; then
              abi="armeabi-v7a"
            elif echo "$basename" | grep -q "x86_64"; then
              abi="x86_64"
            elif echo "$basename" | grep -q "x86"; then
              abi="x86"
            fi

            newname="${APP_NAME}_${GITHUB_REF_NAME}_${abi}.apk"

            cp "$apk" "release-renamed/$newname"

            echo "  $basename"
            echo "    -> $newname"
          done

          echo
          echo "=== Final release files ==="
          ls -lah release-renamed/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-renamed/*.apk
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}